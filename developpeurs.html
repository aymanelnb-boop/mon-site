<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Développeur — JLAymaneeXVI</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#08080f; --card:#131320; --card2:#1a1a2e;
      --border:#1e1e38; --border2:#2a2a48;
      --accent:#7c3aed; --accent2:#a855f7; --accent-glow:rgba(124,58,237,.35);
      --text:#eae8f4; --muted:#5a5a80; --gold:#f59e0b;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;display:flex;flex-direction:column}

    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 60% 50% at 30% 20%,rgba(124,58,237,.12) 0%,transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%,rgba(245,158,11,.07) 0%,transparent 70%);
    }

    /* HEADER */
    header{
      display:flex;align-items:center;justify-content:space-between;
      padding:0 40px;height:60px;
      background:rgba(13,13,26,.95);backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
      position:relative;z-index:10;flex-shrink:0;
    }
    header::after{
      content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,var(--accent) 40%,var(--gold) 60%,transparent);
      opacity:.5;
    }
    .header-logo{
      font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:4px;
      background:linear-gradient(135deg,#a855f7,#7c3aed,#f59e0b);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      text-decoration:none;
    }
    .header-back{
      display:flex;align-items:center;gap:6px;
      padding:7px 16px;border-radius:7px;
      border:1px solid var(--border2);background:var(--card);
      color:var(--muted);font-family:'Barlow Condensed',sans-serif;
      font-size:.82rem;font-weight:700;text-decoration:none;
      transition:all .15s;
    }
    .header-back:hover{border-color:var(--accent);color:var(--accent2);background:rgba(124,58,237,.1)}

    /* MAIN */
    main{
      flex:1;display:flex;flex-direction:column;align-items:center;
      justify-content:center;padding:60px 20px;position:relative;z-index:1;
    }

    /* PAGE TITLE */
    .page-title{
      font-family:'Bebas Neue',sans-serif;font-size:2.8rem;letter-spacing:6px;
      text-align:center;margin-bottom:6px;
      background:linear-gradient(135deg,#a855f7,#7c3aed,#f59e0b);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .page-sub{
      font-family:'Barlow Condensed',sans-serif;font-size:.75rem;font-weight:700;
      letter-spacing:3px;text-transform:uppercase;color:var(--muted);
      margin-bottom:52px;text-align:center;
    }

    /* CARD */
    .dev-card{
      width:340px;max-width:95vw;
      background:var(--card);
      border:1px solid var(--border2);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 0 60px rgba(124,58,237,.12),0 24px 48px rgba(0,0,0,.5);
      animation:fadeUp .6s .1s both;
      position:relative;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

    /* Card top accent line */
    .dev-card::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold));
      z-index:2;
    }

    /* IMAGE ZONE */
    .card-img-wrap{
      width:100%;height:240px;
      background:linear-gradient(160deg,#0d0d1a 0%,#1a1040 50%,#0d0d1a 100%);
      display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden;
    }
    .card-img-wrap::after{
      content:'';position:absolute;bottom:0;left:0;right:0;height:80px;
      background:linear-gradient(to top,var(--card),transparent);
    }
    .card-avatar{
      width:160px;height:160px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid rgba(124,58,237,.4);
      box-shadow:0 0 30px rgba(124,58,237,.3);
      position:relative;z-index:1;
    }

    /* CARD BODY */
    .card-body{padding:20px 24px 24px}

    .card-pseudo{
      font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:3px;
      color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px;
    }
    .card-emoji{font-size:1.4rem;line-height:1}

    .card-role{
      font-family:'Barlow Condensed',sans-serif;font-size:.72rem;font-weight:800;
      letter-spacing:3px;text-transform:uppercase;
      color:var(--accent2);margin-bottom:18px;
    }

    .card-divider{
      height:1px;background:var(--border);margin-bottom:18px;
    }

    /* SOCIALS */
    .card-socials{display:flex;gap:8px}
    .social-btn{
      display:flex;align-items:center;gap:7px;
      padding:8px 14px;border-radius:8px;
      border:1px solid var(--border2);background:var(--card2);
      color:var(--muted);font-family:'Barlow Condensed',sans-serif;
      font-size:.78rem;font-weight:700;letter-spacing:.5px;
      text-decoration:none;transition:all .15s;
    }
    .social-btn:hover{
      border-color:#9147ff;background:rgba(145,71,255,.1);color:#bf94ff;
      transform:translateY(-1px);box-shadow:0 4px 16px rgba(145,71,255,.2);
    }
    .social-btn svg{flex-shrink:0}

    /* FOOTER */
    footer{
      text-align:center;padding:24px;
      font-family:'Barlow Condensed',sans-serif;font-size:.68rem;
      font-weight:600;letter-spacing:1px;color:var(--muted);
      position:relative;z-index:1;
    }
  </style>
</head>
